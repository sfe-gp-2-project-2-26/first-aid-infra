name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Write SSH private key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > deploy_key
          chmod 600 deploy_key

      - name: Copy production files to server
        run: |
          scp -i deploy_key -o StrictHostKeyChecking=no \
            docker-compose.prod.yml.tpl \
            Caddyfile \
            ubuntu@${{ secrets.SERVER_IP }}:/home/ubuntu/medaid/app/docker-compose.prod.yml
          
          scp -i deploy_key -o StrictHostKeyChecking=no \
            Caddyfile \
            ubuntu@${{ secrets.SERVER_IP }}:/home/ubuntu/medaid/app/Caddyfile

      - name: Pull latest code and redeploy
        run: |
          ssh -i deploy_key -o StrictHostKeyChecking=no ubuntu@${{ secrets.SERVER_IP }} << 'REMOTE'
            set -e
            cd /home/ubuntu/medaid/app

            # Pull latest code from all submodule services
            git pull origin main
            git submodule update --remote --merge

            # Write env file fresh each deploy
            cat > .env << ENV
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          ENV

            # Rebuild changed images and restart
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # Verify all containers are running
            sleep 10
            docker compose -f docker-compose.prod.yml ps
          REMOTE
